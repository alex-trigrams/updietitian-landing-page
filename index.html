<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:    "#201C12",
          sand:   "#EAE6D7",
          green:  "#1D4032",
          orange: "#FF6C00",
          "sand-2": "#dfdac6",
          "ink-2":  "#13110a"
        },
        fontFamily: {
          display: ["Anton", "Impact", "system-ui", "sans-serif"],
          sans:    ["Archivo", "system-ui", "sans-serif"],
          mono:    ["JetBrains Mono", "ui-monospace", "monospace"]
        }
      }
    }
  };
</script>
<style>
  html, body { background: #EAE6D7; color: #201C12; }
  body { font-family: 'Archivo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .font-display { font-family: 'Anton', Impact, system-ui, sans-serif; letter-spacing: .01em; }
  .font-mono    { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .skew-italic  { transform: skew(-8deg, 0); display: inline-block; }
  /* gritty noise overlay */
  .noise::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.18;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/></svg>");}
  .scan::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.6) 0 1px, transparent 1px 3px);}
  .ticker { animation: ticker 30s linear infinite; }
  .ticker-slow { animation: ticker 60s linear infinite; }
  .ticker-rev  { animation: tickerRev 40s linear infinite; }
  @keyframes ticker    { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes tickerRev { from { transform: translateX(-50%); } to { transform: translateX(0); } }
  .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }
  @keyframes pulseDot { 0%,100%{ opacity:.35; transform: scale(.85);} 50%{ opacity:1; transform: scale(1);} }
  .kinetic-row { will-change: transform; }
  .grain-bg{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/></svg>");}
  /* selection */
  ::selection { background: #FF6C00; color: #EAE6D7; }
  /* density */
  [data-density="airy"]    { --gap-y: clamp(96px, 12vw, 180px); --pad-y: clamp(80px, 10vw, 140px); }
  [data-density="compact"] { --gap-y: clamp(48px, 6vw, 88px);   --pad-y: clamp(40px, 5vw, 72px); }
  /* hide scrollbars in horizontal drag-reveal */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  /* cursor blob */
  #cursor-blob{position:fixed;top:0;left:0;width:18px;height:18px;border-radius:9999px;background:#FF6C00;pointer-events:none;z-index:60;mix-blend-mode:difference;transform:translate3d(-100px,-100px,0);transition:width .2s,height .2s,opacity .2s;opacity:0}
  @media (hover:hover){ #cursor-blob{opacity:1} }
  /* button shimmer */
  .btn-shine{position:relative;overflow:hidden}
  .btn-shine::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-110%);transition:transform .7s}
  .btn-shine:hover::after{transform:translateX(110%)}
  /* marquee gradient mask edges */
  .mask-fade{ -webkit-mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent); mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent); }
  /* sticky cta safe area */
  .safe-b { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  /* drag-reveal slider thumb */
  .reveal-handle{ background: #FF6C00; box-shadow: 0 0 0 6px rgba(255,108,0,.18), 0 8px 20px rgba(0,0,0,.25); }
  /* about counter */
  .tabular { font-variant-numeric: tabular-nums; }

  /* override important: hide cursor blob on touch */
  @media (pointer: coarse) { #cursor-blob{ display:none } }
</style>
</head>

</body>
</html>
